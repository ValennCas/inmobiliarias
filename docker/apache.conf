# La raiz del sitio lleva a la pagina principal
RedirectMatch ^/$ /frontend/index.html

# Detras del proxy de Render, Apache arma las redirecciones con su puerto interno (10000) y con http.
# Se corrigen para que apunten al dominio publico, sin puerto y con https.
Header always edit Location "^https?://([^/:]+)(:[0-9]+)?/" "https://$1/"

# Archivos que nunca se sirven (claves, herramientas de desarrollo)
<FilesMatch "^\.env">
    Require all denied
</FilesMatch>
<Files "hash.php">
    Require all denied
</Files>

# Las fotos subidas son solo imagenes: aunque alguien lograra subir un .php, no se ejecuta
<Directory /var/www/html/backend/cargasImagenes>
    php_admin_flag engine off
</Directory>
